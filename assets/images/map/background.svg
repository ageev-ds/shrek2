<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Фон карты «Путь Шрека». Можно заменить своей картинкой: укажите её в game.json → mapBackground -->
  <defs>
    <radialGradient id="land" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0" stop-color="#7fa34a"/><stop offset="0.6" stop-color="#5d7f33"/><stop offset="1" stop-color="#34501e"/>
    </radialGradient>
    <radialGradient id="lake" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#6f8f5a"/><stop offset="0.7" stop-color="#4a6b3a"/><stop offset="1" stop-color="#34502a"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#1a1208" stop-opacity="0.55"/>
    </radialGradient>
    <g id="tree"><rect x="-4" y="0" width="8" height="18" fill="#4a3322"/><path d="M0 -40 L22 4 L-22 4Z" fill="#2f5a22"/><path d="M0 -58 L16 -22 L-16 -22Z" fill="#3a6b2a"/></g>
    <g id="bush"><circle r="14" fill="#3f6b2a"/><circle cx="14" cy="4" r="11" fill="#4a7a30"/><circle cx="-12" cy="5" r="10" fill="#355c24"/></g>
    <g id="reed" stroke="#2a3d18" stroke-width="3" stroke-linecap="round"><path d="M0 0 L2 -34"/><path d="M8 0 L6 -26"/><ellipse cx="2" cy="-34" rx="3" ry="8" fill="#5a3a1c" stroke="none"/></g>
  </defs>
  <rect width="1600" height="900" fill="url(#land)"/>
  <!-- светлые пятна травы -->
  <g fill="#8fb35a" opacity="0.35">
    <ellipse cx="300" cy="200" rx="180" ry="80"/><ellipse cx="1250" cy="160" rx="200" ry="70"/><ellipse cx="1300" cy="720" rx="220" ry="90"/><ellipse cx="260" cy="720" rx="200" ry="80"/>
  </g>
  <!-- болото в центре -->
  <path d="M560 420 C560 330 700 300 800 310 C930 318 1060 360 1050 460 C1042 560 930 600 800 596 C660 592 560 520 560 420Z" fill="url(#lake)" stroke="#2f4a1e" stroke-width="6"/>
  <g fill="#a4c26a" opacity="0.55">
    <ellipse cx="720" cy="420" rx="40" ry="10"/><ellipse cx="880" cy="480" rx="30" ry="8"/><ellipse cx="820" cy="380" rx="20" ry="6"/><circle cx="660" cy="470" r="8"/><circle cx="950" cy="410" r="6"/>
  </g>
  <g transform="translate(610 500)"><use href="#reed"/></g><g transform="translate(630 510)"><use href="#reed"/></g>
  <g transform="translate(980 520)"><use href="#reed"/></g><g transform="translate(1000 505)"><use href="#reed"/></g>
  <g transform="translate(760 330)"><use href="#reed"/></g>
  <!-- указатель -->
  <g transform="translate(800 460)">
    <rect x="-4" y="-10" width="8" height="60" fill="#4a3322"/>
    <rect x="-70" y="-44" width="140" height="40" rx="6" fill="#8f5f36" stroke="#3b2417" stroke-width="4"/>
    <text x="0" y="-18" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#f5e6c8">БОЛОТО ШРЕКА</text>
  </g>
  <!-- деревья и кусты по краям -->
  <g>
    <use href="#tree" x="80" y="140"/><use href="#tree" x="130" y="170"/><use href="#tree" x="60" y="260"/><use href="#tree" x="110" y="560"/>
    <use href="#tree" x="1520" y="160"/><use href="#tree" x="1470" y="200"/><use href="#tree" x="1550" y="420"/><use href="#tree" x="1500" y="820"/>
    <use href="#tree" x="420" y="880"/><use href="#tree" x="470" y="860"/><use href="#tree" x="1150" y="880"/><use href="#tree" x="700" y="60"/>
    <use href="#bush" x="360" y="330"/><use href="#bush" x="1180" y="300"/><use href="#bush" x="480" y="640"/><use href="#bush" x="1120" y="640"/><use href="#bush" x="900" y="760"/><use href="#bush" x="240" y="440"/>
  </g>
  <!-- грибы и камушки -->
  <g><circle cx="520" cy="250" r="5" fill="#c9b99a"/><circle cx="1060" cy="780" r="6" fill="#c9b99a"/><circle cx="1400" cy="560" r="5" fill="#c9b99a"/>
     <path d="M400 790 q10 -14 20 0z" fill="#c0392b"/><rect x="408" y="790" width="4" height="8" fill="#f5e6c8"/>
     <path d="M1330 330 q10 -14 20 0z" fill="#c0392b"/><rect x="1338" y="330" width="4" height="8" fill="#f5e6c8"/></g>
  <rect width="1600" height="900" fill="url(#vig)"/>
  <rect x="10" y="10" width="1580" height="880" rx="20" fill="none" stroke="#3b2417" stroke-width="12" opacity="0.6"/>
</svg>
